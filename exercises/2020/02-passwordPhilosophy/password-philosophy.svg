<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="monospace"><rect width="820" height="380" fill="#111418"/><text x="60" y="40" fill="#e8ecf4" font-size="16">Password Philosophy: how the two policies judge 1000 passwords</text><rect x="60" y="90" width="329" height="70" fill="#F0E442"/><text x="224" y="130" fill="#0d0f18" font-size="13" font-weight="bold" text-anchor="middle">471</text><rect x="389" y="90" width="136" height="70" fill="#E69F00"/><text x="457" y="130" fill="#0d0f18" font-size="13" font-weight="bold" text-anchor="middle">195</text><rect x="525" y="90" width="139" height="70" fill="#009E73"/><text x="594" y="130" fill="#0d0f18" font-size="13" font-weight="bold" text-anchor="middle">199</text><rect x="664" y="90" width="94" height="70" fill="#0072B2"/><text x="711" y="130" fill="#0d0f18" font-size="13" font-weight="bold" text-anchor="middle">135</text><rect x="60" y="193" width="16" height="16" fill="#F0E442"/><text x="86" y="206" fill="#e8ecf4" font-size="13">valid under both</text><text x="420" y="206" fill="#c8d0dc" font-size="13" text-anchor="end">471</text><rect x="60" y="223" width="16" height="16" fill="#E69F00"/><text x="86" y="236" fill="#e8ecf4" font-size="13">Part 1 only (count)</text><text x="420" y="236" fill="#c8d0dc" font-size="13" text-anchor="end">195</text><rect x="60" y="253" width="16" height="16" fill="#009E73"/><text x="86" y="266" fill="#e8ecf4" font-size="13">Part 2 only (position)</text><text x="420" y="266" fill="#c8d0dc" font-size="13" text-anchor="end">199</text><rect x="60" y="283" width="16" height="16" fill="#0072B2"/><text x="86" y="296" fill="#e8ecf4" font-size="13">neither</text><text x="420" y="296" fill="#c8d0dc" font-size="13" text-anchor="end">135</text><text x="60" y="346" fill="#E69F00" font-size="14">Part 1 total (count policy):    666</text><text x="60" y="370" fill="#009E73" font-size="14">Part 2 total (position policy): 670</text></svg>